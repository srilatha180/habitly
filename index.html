<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habitly - Habit Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="intro">
            <h3>🌱&nbsp;&nbsp;Habitly</h3>
            <p id="currentDate"></p>
        </div>
    </header>

    <main>

       
        <section class="quote-section">
            <div class="quote-card">
                <h2>✨ Daily Motivation</h2>
                <p id="quoteText">Loading...</p>
                <p id="quoteAuthor"></p>
            </div>
        </section>

        
        <section>
            <div class="summary">

                <h2>Summary stats</h2>

                <div class="stats">

                    <div class="sum">
                        <h3 id="doneCount">0/0</h3>
                        <p>Done today</p>
                    </div>

                    <div class="sum">
                        <h3>12 days</h3>
                        <p>Best streak</p>
                    </div>

                    <div class="sum">
                        <h3>78%</h3>
                        <p>This Week</p>
                    </div>

                </div>
            </div>
        </section>

       
        <section class="habits">

            <h2>My habits</h2>

            <div class="user m-3">

                <h2>Add New Habit</h2>

                <input
                    type="text"
                    id="newHabit"
                    placeholder="Enter habit name"
                >

                <div class="emoji-container">

                    <button type="button" data-emoji="💧" class="emoji-btn">💧</button>

                    <button type="button" data-emoji="📚" class="emoji-btn">📚</button>

                    <button type="button" data-emoji="🏃" class="emoji-btn">🏃</button>

                    <button type="button" data-emoji="🧘" class="emoji-btn">🧘</button>

                    <button type="button" data-emoji="🌱" class="emoji-btn">🌱</button>

                </div>

                <button type="button" id="myBtn">Add Habit</button>

            </div>

            <div class="habits-card" id="habitCard">
            </div>

        </section>

    </main>

    <footer>

        <div class="final">
            <p>Built with the CodGen Frontend Internship | codgen.in</p>
        </div>

    </footer>

    <script src="habitly.js"></script>

</body>
</html>
